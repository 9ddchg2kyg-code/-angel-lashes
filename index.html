<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Angel Lashes | Maria Fedorenco</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#fbf9f7;
font-family:'Montserrat',sans-serif;
color:#333;
overflow-x:hidden;
}

.hero{

min-height:100vh;

background:
linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.85)),
url("https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;
text-align:center;

padding:40px;

}

.container{
max-width:700px;
}

.logo{

font-size:56px;
font-family:'Cormorant Garamond',serif;
letter-spacing:2px;
color:#b08d57;

margin-bottom:15px;

}

h1{

font-size:34px;
margin-bottom:20px;

font-family:'Cormorant Garamond',serif;

}

p{

font-size:18px;
line-height:1.8;

margin-bottom:40px;

}

.button{

display:inline-block;

padding:18px 42px;

background:#b08d57;

color:white;

text-decoration:none;

border-radius:40px;

font-weight:600;

transition:.3s;

}

.button:hover{

background:#8f6c39;

transform:translateY(-3px);

}

.scroll{

margin-top:80px;

font-size:13px;

letter-spacing:3px;

color:#999;

animation:float 2s infinite;

}

@keyframes float{

0%{transform:translateY(0);}

50%{transform:translateY(10px);}

100%{transform:translateY(0);}

}

</style>

</head>

<body>

<section class="hero">

<div class="container">

<div class="logo">

Angel Lashes

</div>

<h1>

Maria Fedorenco

</h1>

<p>

Премиальное наращивание ресниц в Кишинёве.<br>

Классика • Объёмы • LED-наращивание

</p>

<a class="button" href="#">

Записаться

</a>

<div class="scroll">

SCROLL ↓

</div>

</div>

</section>

</body>
</html>
