<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Angel_lashes</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#F8F4F9;
color:#3E3553;

}

header{

background:white;
padding:30px 20px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.05);

}

.logo{

width:160px;
border-radius:50%;
margin-bottom:20px;

}

h1{

font-size:40px;
font-weight:600;

}

.subtitle{

color:#8d6eb5;
margin-top:10px;

}

.buttons{

margin-top:35px;
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

}

button{

padding:15px 30px;
border:none;
border-radius:40px;
cursor:pointer;
font-size:17px;
transition:.3s;

}

.main{

background:#8F6DCC;
color:white;

}

.main:hover{

background:#7756b7;

}

.white{

background:white;

}

section{

max-width:1200px;
margin:auto;
padding:70px 20px;

}

.section-title{

font-size:34px;
text-align:center;
margin-bottom:50px;

}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;

}

.card{

background:white;
border-radius:25px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.card img{

width:100%;
height:280px;
object-fit:cover;

}

.card h3{

padding:20px;

}

.price{

font-size:28px;
font-weight:700;
color:#8F6DCC;
padding:0 20px 20px;

}

footer{

background:#8F6DCC;
color:white;
padding:50px;
text-align:center;

}

</style>

</head>

<body>

<header>

<img src="logo.png" class="logo">

<h1>Angel_lashes</h1>

<p class="subtitle">
Наращивание ресниц • LED Lash Extension
</p>

<div class="buttons">

<button class="main">
Онлайн запись
</button>

<button class="white">
Портфолио
</button>

<button class="white">
Прайс
</button>

</div>

</header>

<section>

<h2 class="section-title">
Популярные услуги
</h2>

<div class="cards">

<div class="card">

<img src="1.jpg">

<h3>Классическое наращивание</h3>

<div class="price">
500 MDL
</div>

</div>

<div class="card">

<img src="2.jpg">

<h3>LED Lash Extension</h3>

<div class="price">
550 MDL
</div>

</div>

<div class="card">

<img src="3.jpg">

<h3>2D</h3>

<div class="price">
600 MDL
</div>

</div>

<div class="card">

<img src="4.jpg">

<h3>3D</h3>

<div class="price">
650 MDL
</div>

</div>

</div>

</section>

<footer>

<h2>Angel_lashes</h2>

<p>
Красота начинается со взгляда ✨
</p>

</footer>

</body>
</html>
